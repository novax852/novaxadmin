<!DOCTYPE html>
<!-- saved from url=(0077)file:///C:/Users/Ashik/Downloads/NOVAX_Admin_ETH_Price_Control_ETH_fixed.html -->
<html lang="bn"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOVAX Admin</title>
  <script src="./NOVAX Admin_files/supabase-js@2"></script>
  <style>
    body { font-family: Arial; max-width: 480px; margin: 25px auto; padding: 15px; }
    input, button { box-sizing: border-box; width: 100%; padding: 12px; margin: 7px 0; }
    button { cursor: pointer; }
    #result { white-space: pre-wrap; overflow-wrap: anywhere; }
    #ethStatus, #authInfo { overflow-wrap:anywhere; font-size:13px; }
    hr { margin:20px 0; }
  </style>
</head>
<body>
  <h2>NOVAX Admin Panel</h2>

  <input id="url" placeholder="Supabase Project URL" value="https://moeedqrjyewxnefzpkdf.supabase.co">
  <input id="key" placeholder="Supabase publishable key" value="sb_publishable_1SiSqyON05CujsHpnlvJ1Q_9dnWVfxA">
  <button onclick="connect()">Connect</button>

  <div id="panel">
    <h3>ETH Price Control</h3>
    <p id="authInfo">Logged in User ID: de783dde-ef64-440a-9731-32d69f0b9e7c</p>
    <input id="ethPrice" type="number" min="0.00000001" step="0.01" placeholder="New ETH price in USD">
    <button onclick="updateEthPrice()">Update ETH Price</button>
    <button onclick="loadEthPrice()">Refresh ETH Price</button>
    <p id="ethStatus">Current ETH price: $4505 · Updated: 10/15/2026, 2:03:06 AM</p>
    <hr>
    <h3>User Balance Admin</h3>
    <input id="emailPhone" placeholder="Phone (+880...)">
    <button onclick="findUser()">Find user</button>
    <p id="balance"></p>

    <input id="amount" type="number" step="0.01" placeholder="Amount (e.g. 100 or -50)">
    <input id="note" placeholder="Reason for adjustment">
    <button onclick="adjust()">Apply balance change</button>
    <button onclick="history()">Show balance history</button>
    <button onclick="logout()">Log out</button>
  </div>

  <pre id="result">Logged in. ETH update will be verified by the database.</pre>

<script>
let sb;
const el = id => document.getElementById(id);
const show = msg => el('result').textContent = msg;

async function connect() {
  try {
    sb = window.supabase.createClient(
      el('url').value.trim(), el('key').value.trim()
    );
    const { data, error } = await sb.auth.getSession();
    if (error) throw error;

    if (!data.session) {
      const identifier = prompt('আপনার নিবন্ধিত ফোন নম্বর বা ইমেইল দিন (যেমন: 01700000000@novax.com)');
      const password = prompt('আপনার পাসওয়ার্ড দিন');
      if (!identifier || !password) return;
      
      const res = await sb.auth.signInWithPassword({
        email: identifier.includes('@') ? identifier.trim() : identifier.trim() + '@novax.com',
        password
      });
      if (res.error) throw res.error;
    }

    const { data: sessionData, error: sessionError } = await sb.auth.getSession();
    if (sessionError) throw sessionError;
    if (!sessionData.session) throw new Error('Login session not found. Please Connect and sign in again.');
    el('panel').hidden = false;
    el('authInfo').textContent = 'Logged in User ID: ' + (sessionData.session.user?.id || 'unknown');
    show('Logged in. ETH update will be verified by the database.');
    await loadEthPrice();
  } catch (e) { show(e.message); }
}

async function loadEthPrice() {
  if (!sb) return show('প্রথমে Connect করে লগইন করুন।');
  const status = el('ethStatus');
  status.textContent = 'ETH price loading…';
  try {
    const { data, error } = await sb
      .from('eth_price_settings')
      .select('setting_key, custom_price, updated_at')
      .eq('setting_key', 'ETH')
      .maybeSingle();
    if (error) throw error;
    if (!data) {
      status.textContent = 'eth_price_settings-এ setting_key = ETH রেকর্ড পাওয়া যায়নি।';
      return;
    }
    el('ethPrice').value = data.custom_price ?? '';
    status.textContent = 'Current ETH price: $' + data.custom_price +
      (data.updated_at ? ' · Updated: ' + new Date(data.updated_at).toLocaleString() : '');
  } catch (e) {
    status.textContent = 'Price read error: ' + (e.message || String(e));
  }
}

async function updateEthPrice() {
  if (!sb) return show('প্রথমে Connect করে লগইন করুন।');
  const price = Number(el('ethPrice').value);
  if (!Number.isFinite(price) || price <= 0 || price > 1000000000) {
    el('ethStatus').textContent = '০-এর বেশি এবং 1,000,000,000-এর কম বা সমান সঠিক ETH price দিন।';
    return;
  }
  if (!confirm('ETH price $' + price + ' হিসেবে আপডেট করবেন?')) return;
  el('ethStatus').textContent = 'Updating…';
  try {
    const { data: sessionData, error: sessionError } = await sb.auth.getSession();
    if (sessionError) throw sessionError;
    if (!sessionData.session) throw new Error('No active login session. Please log in again.');
    const { data, error } = await sb.rpc('admin_update_eth_price', { p_price: price });
    if (error) throw error;
    el('ethStatus').textContent = 'Update result: ' + JSON.stringify(data);
    await loadEthPrice();
  } catch (e) {
    el('ethStatus').textContent = 'ETH update error: ' + (e.message || String(e)) +
      '. Check that this browser is logged into the same Supabase Auth user whose UUID is in public.admin_users.';
  }
}

async function findUser() {
  const { data, error } = await sb.rpc('admin_find_user', {
    p_phone: el('emailPhone').value.trim()
  });
  if (error) return show(error.message);
  if (!data.length) return show('User not found');
  el('balance').textContent =
    'Current balance: ' + data[0].balance + ' USDT';
  show('User found: ' + data[0].phone);
}

async function adjust() {
  const amount = Number(el('amount').value);
  if (!Number.isFinite(amount) || amount === 0)
    return show('একটি সঠিক non-zero amount দিন।');

  if (!confirm('এই balance change নিশ্চিত করবেন?')) return;

  const { data, error } = await sb.rpc('admin_adjust_balance', {
    p_phone: el('emailPhone').value.trim(),
    p_change: amount,
    p_note: el('note').value.trim()
  });

  if (error) return show(error.message);
  show(JSON.stringify(data, null, 2));
  await findUser();
}

async function history() {
  const { data, error } = await sb.rpc('admin_balance_history', {
    p_phone: el('emailPhone').value.trim()
  });
  if (error) return show(error.message);
  show(JSON.stringify(data, null, 2));
}

async function logout() {
  const { error } = await sb.auth.signOut();
  show(error ? error.message : 'Logged out.');
  el('panel').hidden = true;
}
</script>

</body></html>
